services:

  backend:

    build: .

    container_name: vehicle-loan-backend

    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    restart: unless-stopped


  frontend:

    build: .

    container_name: vehicle-loan-frontend

    command: >
      streamlit run frontend/app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      - backend

    restart: unless-stopped